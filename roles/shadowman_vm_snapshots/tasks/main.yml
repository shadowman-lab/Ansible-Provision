---
- name: Snapshot Create VMWare
  ansible.builtin.include_tasks: shadowman_vmware_snapshot_create.yml
  when:
    - shadowman_snapshot == "create"
    - shadowman_provision_hypervisor == "VMWare"

- name: Snapshot Delete VMWare
  ansible.builtin.include_tasks: shadowman_vmware_snapshot_delete.yml
  when:
    - shadowman_snapshot == "delete"
    - shadowman_provision_hypervisor == "VMWare"

- name: Snapshot Create Azure
  ansible.builtin.include_tasks: shadowman_azure_snapshot_create.yml
  when:
    - shadowman_snapshot == "create"
    - shadowman_provision_hypervisor == "Azure"

- name: Snapshot Delete Azure
  ansible.builtin.include_tasks: shadowman_azure_snapshot_delete.yml
  when:
    - shadowman_snapshot == "delete"
    - shadowman_provision_hypervisor == "Azure"

- name: Snapshot Create AWS
  ansible.builtin.include_tasks: shadowman_aws_snapshot_create.yml
  when:
    - shadowman_snapshot == "create"
    - shadowman_provision_hypervisor == "AWS"

- name: Snapshot Delete AWS
  ansible.builtin.include_tasks: shadowman_aws_snapshot_delete.yml
  when:
    - shadowman_snapshot == "delete"
    - shadowman_provision_hypervisor == "AWS"

- name: Snapshot Create OpenShift Virtualization
  ansible.builtin.include_tasks: shadowman_openshift_snapshot_create.yml
  when:
    - shadowman_snapshot == "create"
    - shadowman_provision_hypervisor == "OCPV"

- name: Snapshot Delete OpenShift Virtualization
  ansible.builtin.include_tasks: shadowman_openshift_snapshot_delete.yml
  when:
    - shadowman_snapshot == "delete"
    - shadowman_provision_hypervisor == "OCPV"
