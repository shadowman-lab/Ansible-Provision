---
- name: Get Azure VM info
  azure.azcollection.azure_rm_virtualmachine_info:
    resource_group: "{{ resource_group_name }}"
    name: "{{ inventory_hostname }}"
  register: shadowman_vm_snapshots_azure_vm_info
  delegate_to: localhost

- name: Create Snapshot for Azure VM
  azure.azcollection.azure_rm_snapshot:
    resource_group: "{{ resource_group_name }}"
    name: "{{ name_of_snapshot }}"
    location: "{{ shadowman_vm_snapshots_azure_vm_info.vms[0].location }}"
    creation_data:
      create_option: Copy
      source_uri: "{{ shadowman_vm_snapshots_azure_vm_info.vms[0].storage_profile.os_disk.managed_disk.id }}"
    tags:
      description: "{{ snapshot_description }}"
  delegate_to: localhost
