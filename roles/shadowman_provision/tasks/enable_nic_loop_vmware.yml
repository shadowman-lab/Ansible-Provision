---

- name: Get VM info
  vmware.vmware.guest_info:
    name: "{{ item }}"
    datacenter: "Shadowman-DC"
    validate_certs: false
  register: vm_info

- name: Connect Ethernet
  vmware.vmware.vm:
    moid: "{{ vm_info.guests[0].moid }}"
    datacenter: "Shadowman-DC"
    network_adapters:
      - network: "dvportgroup-64"
        connected: true
        connect_at_power_on: true
    validate_certs: false

- name: Loop until hostname is set correctly
  vmware.vmware.guest_info:
    name: "{{ item }}"
    datacenter: "Shadowman-DC"
    validate_certs: false
  register: vm_full_info
  until: (vm_full_info.guests[0].identity.host_name | default("False") == item.split('.')[0]) or (vm_full_info.guests[0].identity.host_name | default("False") == item)
  retries: 120
  delay: 10
